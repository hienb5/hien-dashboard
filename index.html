<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5e4b">
<title>Dashboard Hiển</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'&&t!=='bw'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="style.css">
</head><body>

<header>
  <div class="right">
    <div id="alert" class="alert" hidden></div>
    <div id="status" class="status"></div>
    <div class="btns">
      <button id="btnIdle" class="ghost" title="Mở chế độ Màn hình chờ (dùng cho màn hình phụ)">Màn hình chờ</button>
      <button id="btnView" class="ghost" title="Chọn phần hiển thị">☰ Hiển thị</button>
      <div class="themes" role="group" aria-label="Giao diện">
        <button type="button" data-theme-btn="light" aria-pressed="false">Sáng</button>
        <button type="button" data-theme-btn="dark" aria-pressed="false">Tối</button>
        <button type="button" data-theme-btn="bw" aria-pressed="false">Đen trắng</button>
      </div>
      <button id="btnRefresh" class="ghost" title="Làm mới">Làm mới</button>
      <button id="btnSettings" class="ghost" title="Chọn lịch hiển thị">Lịch</button>
      <button id="btnAuth" class="primary" title="Đăng nhập Google">Đăng nhập Google</button>
    </div>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<div class="wrap">
  <section class="info" id="rowInfo">
    <section class="card sm cw" id="cardWx">
    <div class="clk" id="hdLeft">
      <div id="clock">--:--</div>
      <div id="date"></div>
      <div id="lunar"></div>
      <div class="quote" id="quote"><q id="qText"></q><small><span id="qSrc"></span> <button type="button" id="qNext" class="lnk" title="Xem câu khác" aria-label="Xem câu khác">↻</button></small></div>
    </div>
      <div class="wxcol"><h2><span class="ttl">Thời tiết · Ninh Bình</span></h2>
      <div id="wxBody" class="wxb">Đang tải…</div></div>
    </section>
    <section class="card urgent" id="cardUrgent">
      <h2><span class="ttl">Quá hạn &amp; hôm nay</span></h2>
      <div class="ucols" id="urgentBody"></div>
    </section>
      <section class="card sm notes" id="cardNotes" data-key="notes">
        <h2><span class="ttl">Ghi chú</span></h2>
        <div id="notesBody" class="cb"></div>
        <div id="notesAdd"></div>
      </section>
  </section>

  <div class="split" id="splitInfo" title="Kéo để đổi chiều cao hàng (bấm đúp để về mặc định)" role="separator"></div>

  <section id="mainWrap">
    <div class="rowtitle">CÔNG VIỆC</div>
    <main class="grid" id="grid">
    </main>
  </section>

  <div class="split" id="splitWeek" title="Kéo để đổi chiều cao hàng (bấm đúp để về mặc định)" role="separator"></div>

  <section class="card sm" id="cardWeek">
    <h2><span class="ttl">Việc trong tuần</span>
      <form class="quick" id="quickAdd"><input type="text" placeholder="Thêm sự kiện nhanh: Họp 14h mai" aria-label="Thêm sự kiện nhanh" required><button>Thêm</button></form>
      <span class="tabs" id="weekTabs" role="group" aria-label="Khoảng thời gian">
        <button type="button" data-mode="week" aria-pressed="false">Tuần này</button>
        <button type="button" data-mode="7" aria-pressed="false">7 ngày tới</button>
        <button type="button" data-mode="5" aria-pressed="false">5 ngày</button>
      </span>
    </h2>
    <div id="weekBody" class="wk"></div>
  </section>
</div>

<div id="idle" hidden aria-label="Màn hình chờ">
  <div class="i-ctl" id="iCtl"><button type="button" id="iFull">Toàn màn hình</button><button type="button" id="iExit">Thoát</button></div>
  <div class="i-root">
    <div class="i-left">
      <div class="i-time" id="iClock">--:--</div>
      <div class="i-date" id="iDate"></div>
      <div class="i-rule"></div>
      <div class="i-wx" id="iWx"></div>
      <div class="i-quote" id="iQuote"></div>
    </div>
    <div class="i-right">
      <section class="i-sec" id="iLate"><h3></h3><div class="i-list"></div></section>
      <section class="i-sec" id="iToday"><h3></h3><div class="i-list"></div></section>
      <section class="i-sec" id="iNext"><h3></h3><div class="i-list"></div></section>
    </div>
  </div>
</div>

<dialog id="dlgView">
  <form method="dialog">
    <h3>Hiển thị</h3>
    <div class="presets" id="presets">
      <button type="button" data-preset="min">Gọn</button>
      <button type="button" data-preset="daily">Hằng ngày</button>
      <button type="button" data-preset="full">Đầy đủ</button>
    </div>
    <div class="callist" id="viewList"></div>
    <p class="hint">Lựa chọn được nhớ riêng trên máy này.</p>
    <menu><button value="close">Đóng</button></menu>
  </form>
</dialog>

<dialog id="dlg">
  <form method="dialog">
    <h3>Lịch Google được hiển thị</h3>
    <div id="calList" class="callist">Đang tải…</div>
    <menu><button value="close">Đóng</button></menu>
  </form>
</dialog>

<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gsiReady&&window.__gsiReady()"></script>
</body></html>
