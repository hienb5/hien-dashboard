<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5e4b">
<title>Dashboard Hiển</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head><body>

<header>
  <div>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>
  <div class="right">
    <div id="status" class="status"></div>
    <div class="btns">
      <button id="btnRefresh" class="ghost" title="Làm mới">Làm mới</button>
      <button id="btnSettings" class="ghost" title="Chọn lịch hiển thị">Lịch</button>
      <button id="btnAuth" class="primary">Đăng nhập Google</button>
    </div>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main class="grid">
  <section class="card" id="col-personal">
    <h2>Cá nhân <span id="n-personal"></span></h2>
    <div id="tasks-personal"></div>
    <form class="add" data-group="personal"><input type="text" placeholder="Thêm việc…" aria-label="Thêm việc cá nhân" required><input type="date" aria-label="Hạn"><button>Thêm</button></form>

    <div class="sub">Lịch hôm nay</div>
    <div id="ev-today"></div>
    <div class="sub">Ngày mai</div>
    <div id="ev-tomorrow"></div>
    <form class="quick" id="quickAdd"><input type="text" placeholder="Thêm sự kiện nhanh, vd: Họp 14h ngày mai" aria-label="Thêm sự kiện nhanh" required><button>Thêm</button></form>
  </section>

  <section class="card" id="col-cangvu">
    <h2>Cảng vụ <span id="n-cangvu"></span></h2>
    <div id="tasks-cangvu"></div>
    <form class="add" data-group="cangvu"><input type="text" placeholder="Thêm việc Cảng vụ…" aria-label="Thêm việc Cảng vụ" required><input type="date" aria-label="Hạn"><button>Thêm</button></form>
  </section>

  <section class="card" id="col-hienvinh">
    <h2>Hiển Vinh <span id="n-hienvinh"></span></h2>
    <div id="tasks-hienvinh"></div>
    <form class="add" data-group="hienvinh"><input type="text" placeholder="Thêm việc Hiển Vinh…" aria-label="Thêm việc Hiển Vinh" required><input type="date" aria-label="Hạn"><button>Thêm</button></form>
  </section>
</main>

<footer id="foot"></footer>

<dialog id="dlg">
  <form method="dialog">
    <h3>Lịch hiển thị trong "Lịch hôm nay"</h3>
    <div id="calList" class="callist">Đang tải…</div>
    <menu><button value="close">Đóng</button></menu>
  </form>
</dialog>

<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gsiReady&&window.__gsiReady()"></script>
</body></html>
